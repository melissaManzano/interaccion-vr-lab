<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" width="760" height="1000" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">
  <title>Esquema del laboratorio: planta y alzado (medidas de js/config.js)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#86efac" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="760" height="1000" fill="#ffffff"/>

  <!-- ===================== PLANTA (vista superior) ===================== -->
  <text x="20" y="28" font-size="17" font-weight="700" fill="#0f172a">1. Planta (vista superior) · escala 1 m = 200 px · el usuario mira hacia −Z (arriba)</text>

  <!-- Zona de trabajo libre entre el usuario y el mostrador -->
  <rect x="250" y="275" width="260" height="115" fill="url(#hatch)" opacity="0.55"/>
  <text x="380" y="300" text-anchor="middle" fill="#166534" font-weight="600">Zona de trabajo libre (sin obstáculos)</text>

  <!-- Alcance del brazo -->
  <circle cx="380" cy="390" r="140" fill="none" stroke="#64748b" stroke-dasharray="6 5"/>
  <text x="525" y="470" fill="#475569">alcance del brazo ≈ 0.7 m</text>
  <text x="525" y="485" fill="#475569">(más lejos: rayo + "carrete")</text>

  <!-- Mesas -->
  <g fill="#cbd5e1" stroke="#2563eb" stroke-width="3">
    <rect x="125" y="125" width="110" height="110"/>
    <rect x="525" y="125" width="110" height="110"/>
    <rect x="125" y="285" width="110" height="110"/>
    <rect x="525" y="285" width="110" height="110"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1e3a8a">
    <text x="180" y="175">Mesa 2</text><text x="180" y="191" font-weight="400">(−1.0, −1.05)</text>
    <text x="580" y="175">Mesa 3</text><text x="580" y="191" font-weight="400">(1.0, −1.05)</text>
    <text x="180" y="335">Mesa 1</text><text x="180" y="351" font-weight="400">(−1.0, −0.25)</text>
    <text x="580" y="335">Mesa 4</text><text x="580" y="351" font-weight="400">(1.0, −0.25)</text>
  </g>
  <g text-anchor="middle" fill="#334155">
    <text x="180" y="222">5 figuras mezcladas</text>
    <text x="580" y="222">5 figuras mezcladas</text>
    <text x="180" y="382">5 figuras mezcladas</text>
    <text x="580" y="382">5 figuras mezcladas</text>
  </g>

  <!-- Mostrador y recipientes -->
  <rect x="250" y="185" width="260" height="90" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <rect x="260" y="203" width="54" height="54" fill="#fff7ed" stroke="#f57c00" stroke-width="4"/>
  <rect x="322" y="203" width="54" height="54" fill="#eff6ff" stroke="#1e88e5" stroke-width="4"/>
  <rect x="384" y="203" width="54" height="54" fill="#fdf2f8" stroke="#ec407a" stroke-width="4"/>
  <rect x="446" y="203" width="54" height="54" fill="#faf5ff" stroke="#8e24aa" stroke-width="4"/>
  <g text-anchor="middle" font-weight="700" font-size="13">
    <text x="287" y="235" fill="#c2410c">A</text>
    <text x="349" y="235" fill="#1d4ed8">B</text>
    <text x="411" y="235" fill="#be185d">C</text>
    <text x="473" y="235" fill="#7e22ce">D</text>
  </g>
  <text x="380" y="198" text-anchor="middle" fill="#334155" font-size="11">Mostrador 1.30 × 0.45 m · recipientes 27 × 27 cm</text>

  <!-- Marcador y botones -->
  <rect x="265" y="123" width="230" height="6" fill="#0ea5e9"/>
  <text x="380" y="117" text-anchor="middle" fill="#0369a1" font-weight="600">Marcador 3D (z = −1.32)</text>
  <rect x="278" y="134" width="60" height="6" fill="#2563eb"/>
  <rect x="350" y="134" width="60" height="6" fill="#0d9488"/>
  <rect x="422" y="134" width="60" height="6" fill="#b91c1c"/>
  <g text-anchor="middle" font-size="10" fill="#334155">
    <text x="308" y="152">Reinicio</text><text x="380" y="152">Iniciar</text><text x="452" y="152">Salir</text>
  </g>

  <!-- Recorridos seguros de las manos: de cada mesa a los recipientes, POR ENCIMA del borde -->
  <g fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrow)">
    <path d="M235,330 Q262,300 280,262"/>
    <path d="M235,190 Q252,225 258,236"/>
    <path d="M525,330 Q498,300 480,262"/>
    <path d="M525,190 Q508,225 502,236"/>
  </g>
  <text x="20" y="455" fill="#0f766e" font-weight="600">- - → recorrido seguro de la mano:</text>
  <text x="20" y="471" fill="#0f766e">levantar, cruzar sobre el borde (≥ 0.9 m)</text>
  <text x="20" y="487" fill="#0f766e">y soltar centrado sobre el recipiente</text>

  <!-- Usuario -->
  <circle cx="380" cy="390" r="16" fill="#facc15" stroke="#a16207" stroke-width="2"/>
  <path d="M380,366 L372,378 L388,378 z" fill="#a16207"/>
  <text x="380" y="425" text-anchor="middle" font-weight="700" fill="#713f12">Usuario (0, 0)</text>
  <text x="380" y="441" text-anchor="middle" fill="#713f12">de pie o sentado</text>

  <!-- Cotas -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="380" y1="275" x2="380" y2="366"/>
  </g>
  <text x="386" y="335" fill="#475569">0.58 m al borde</text>
  <text x="20" y="543" fill="#64748b">Suelo físico: plano infinito · área visible: círculo de 3 m de radio · fuera de 3.2 m la figura vuelve a su mesa.</text>

  <!-- ===================== ALZADO (vista frontal) ===================== -->
  <line x1="20" y1="553" x2="740" y2="553" stroke="#e2e8f0"/>
  <text x="20" y="578" font-size="17" font-weight="700" fill="#0f172a">2. Alzado (vista frontal) · alturas en metros desde el suelo (y)</text>

  <!-- Banda de trabajo de las manos -->
  <rect x="60" y="719" width="680" height="68" fill="#ccfbf1" opacity="0.6"/>
  <text x="735" y="732" text-anchor="end" fill="#0f766e" font-weight="600">zona de manos al depositar 0.9–1.3 m</text>

  <!-- Suelo -->
  <line x1="40" y1="940" x2="740" y2="940" stroke="#334155" stroke-width="3"/>

  <!-- Mesas (lado izquierdo y derecho) -->
  <g fill="#cbd5e1" stroke="#2563eb" stroke-width="2">
    <rect x="125" y="812" width="110" height="7"/>
    <rect x="525" y="812" width="110" height="7"/>
  </g>
  <g fill="#2563eb"><rect x="125" y="808" width="3" height="4"/><rect x="232" y="808" width="3" height="4"/><rect x="525" y="808" width="3" height="4"/><rect x="632" y="808" width="3" height="4"/></g>
  <g fill="#475569">
    <rect x="133" y="819" width="7" height="121"/><rect x="220" y="819" width="7" height="121"/>
    <rect x="533" y="819" width="7" height="121"/><rect x="620" y="819" width="7" height="121"/>
  </g>
  <text x="180" y="860" text-anchor="middle" fill="#1e3a8a" font-weight="600">Mesa 0.75 m</text>
  <text x="580" y="860" text-anchor="middle" fill="#1e3a8a" font-weight="600">Mesa 0.75 m</text>

  <!-- Mostrador -->
  <rect x="250" y="812" width="260" height="128" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="380" y="880" text-anchor="middle" fill="#334155" font-weight="600">Mostrador 0.75 m</text>

  <!-- Recipientes -->
  <g fill="#ffffff" stroke-width="3">
    <rect x="260" y="789" width="54" height="23" stroke="#f57c00"/>
    <rect x="322" y="789" width="54" height="23" stroke="#1e88e5"/>
    <rect x="384" y="789" width="54" height="23" stroke="#ec407a"/>
    <rect x="446" y="789" width="54" height="23" stroke="#8e24aa"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="700">
    <text x="287" y="805" fill="#c2410c">A</text><text x="349" y="805" fill="#1d4ed8">B</text>
    <text x="411" y="805" fill="#be185d">C</text><text x="473" y="805" fill="#7e22ce">D</text>
  </g>

  <!-- Botones -->
  <rect x="278" y="752" width="60" height="15" fill="#2563eb"/>
  <rect x="350" y="752" width="60" height="15" fill="#0d9488"/>
  <rect x="422" y="752" width="60" height="15" fill="#b91c1c"/>

  <!-- Alturas de los ojos -->
  <g stroke-dasharray="5 4" stroke-width="1.5">
    <line x1="60" y1="668" x2="740" y2="668" stroke="#a16207"/>
    <line x1="60" y1="736" x2="740" y2="736" stroke="#ca8a04"/>
  </g>
  <text x="735" y="662" text-anchor="end" fill="#a16207">ojos de pie ≈ 1.6 m</text>
  <text x="735" y="752" text-anchor="end" fill="#ca8a04">ojos sentado ≈ 1.2 m</text>

  <!-- Marcador -->
  <rect x="265" y="607" width="230" height="139" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <text x="380" y="650" text-anchor="middle" fill="#e2e8f0" font-weight="700">Marcador 3D</text>
  <text x="380" y="670" text-anchor="middle" fill="#94a3b8">0/20 · 0/5 por bote · errores</text>
  <text x="380" y="688" text-anchor="middle" fill="#94a3b8">precisión · tiempos</text>

  <!-- Eje de alturas -->
  <g fill="#334155" font-size="11" text-anchor="end">
    <line x1="52" y1="600" x2="52" y2="940" stroke="#334155"/>
    <text x="48" y="944">0</text>
    <text x="48" y="816">0.75</text>
    <text x="48" y="793">0.89</text>
    <text x="48" y="764">1.06</text>
    <text x="48" y="750">1.14</text>
    <text x="48" y="610">1.96</text>
  </g>
  <g stroke="#334155"><line x1="52" y1="812" x2="58" y2="812"/><line x1="52" y1="789" x2="58" y2="789"/><line x1="52" y1="760" x2="58" y2="760"/><line x1="52" y1="746" x2="58" y2="746"/><line x1="52" y1="607" x2="58" y2="607"/></g>
  <text x="62" y="975" fill="#475569">0.89 m = borde de los recipientes (paredes de 14 cm) · 1.06 m = botones · 1.14–1.96 m = marcador · figuras de 6–7 cm</text>
  <text x="62" y="992" fill="#475569">Las figuras aparecen 1 cm sobre su mesa y caen por gravedad: nunca quedan suspendidas ni encimadas.</text>
</svg>
